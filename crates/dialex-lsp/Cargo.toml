[package]
name = "dialex-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dialex-language-server"
path = "src/main.rs"

[lib]
name = "dialex_lsp"
path = "src/lib.rs"

[dependencies]
crossbeam-channel = "0.5"
dialex-cli = { path = "../dialex-cli" }
dialex-syntax = { path = "../dialex-syntax" }
fancy-regex = "0.16"
lsp-server = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"

[dev-dependencies]
tempfile = "3"
