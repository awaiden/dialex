[package]
name = "dialex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dx"
path = "src/main.rs"

[lib]
name = "dialex_cli"
path = "src/lib.rs"

[dependencies]
dialex-icu = { path = "../dialex-icu" }
dialex-syntax = { path = "../dialex-syntax" }
globset = "0.4"
ignore = "0.4"
pathdiff = "0.2"
rayon = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
