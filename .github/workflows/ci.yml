name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Monorepo (Format, Lint, Tests, Builds)
        run: bun run ready

      - name: Smoke test the packed packages
        run: node scripts/smoke-pack.mjs

  changeset:
    name: Changeset present
    # A pull request that changes a published package needs a changeset (bun run changeset).
    # The Version Packages pull request consumes them, so it is exempt.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for a changeset
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  zed-extension:
    name: Zed extension builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add the WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Build the extension
        working-directory: packages/zed
        run: cargo build --release --target wasm32-wasip2 --locked
