name: Native build

# Builds `dx` and `dialex-language-server` on a runner of each platform. The Release workflow calls
# it before publishing; run it by hand (Actions, "Run workflow") or push a `native-build/*` branch
# to see that every platform builds and starts, without releasing anything.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["native-build/**"]

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, ext: "" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, ext: "" }
          - { target: darwin-x64, runner: macos-15-intel, ext: "" }
          - { target: darwin-arm64, runner: macos-latest, ext: "" }
          - { target: win32-x64, runner: windows-latest, ext: ".exe" }
          - { target: win32-arm64, runner: windows-11-arm, ext: ".exe" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        working-directory: crates
        shell: bash
        run: cargo build --release --locked -p dialex-cli -p dialex-lsp

      - name: Binaries start
        working-directory: crates
        shell: bash
        run: |
          ./target/release/dx${{ matrix.ext }} --version
          ./target/release/dialex-language-server${{ matrix.ext }} --version

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            crates/target/release/dx${{ matrix.ext }}
            crates/target/release/dialex-language-server${{ matrix.ext }}
          if-no-files-found: error
