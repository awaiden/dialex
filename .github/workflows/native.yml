name: Native

# The Rust crates in crates/ (the native `dx` and `dialex-language-server`). The TypeScript
# implementation is the oracle: the parity scripts run both on the same projects and compare.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/cli/**"
      - "packages/language-server/**"
      - "packages/core/src/icu/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packages/cli/**"
      - "packages/language-server/**"
      - "packages/core/src/icu/**"
      - ".github/workflows/native.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}

      - name: Format
        working-directory: crates
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: crates
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (golden corpora)
        working-directory: crates
        run: cargo test --workspace --release --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build the Node packages
        run: |
          bun install --frozen-lockfile
          bun run build:packages
          bun run typegen:examples

      - name: Build the binaries
        working-directory: crates
        run: cargo build --release --locked

      # Byte-identical files and output from `dx generate` / `dx check`
      - name: Parity, generate
        run: node crates/tests/parity.mjs generate

      - name: Parity, check
        run: node crates/tests/parity.mjs check

      - name: Parity, check --json
        run: node crates/tests/parity.mjs check --json

      # Same diagnostics, hovers, definitions, completions and quick fixes from both servers
      - name: Parity, language server
        run: node crates/tests/lsp-parity.mjs
