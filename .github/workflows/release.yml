name: Release

# Every push to main publishes what is not on npm yet. When changesets are pending, the same run
# first bumps the versions, writes the changelogs and rebuilds bun.lock, checks the result, and
# pushes that "Version Packages" commit to main before it publishes. There is no pull request in
# between. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version commit, the tag and the GitHub Release
  actions: write # start the docs build for a version commit (a bot push does not trigger it)
  id-token: write # npm provenance

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pending changesets are consumed here: versions bumped, changelogs written, bun.lock rebuilt
      # (`changeset:version`). The commit stays local until the checks below have passed.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          # no grep here: with pipefail it would fail the step when nothing is pending
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run changeset:version
          git add -A
          git diff --cached --quiet || git commit -m "Version Packages"
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: bun run ready

      - name: Smoke test the packed packages
        run: node scripts/smoke-pack.mjs

      # Pushed before publishing so main never lags behind what is on npm. A push made with the
      # workflow token does not start another run, so there is no loop. If main moved in the
      # meantime this fails, and the run of that newer push versions again.
      - name: Push the version commit
        if: steps.version.outputs.versioned == 'true'
        run: git push origin HEAD:main

      # `bun pm pack` writes the versions of workspace dependencies from bun.lock. `changeset:version`
      # rebuilds the lock, and checking each tarball is what stops a package from depending on a
      # stale release (0.2.0 did).
      - name: Publish what is not on npm yet
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published=""
          for dir in core cli eslint-plugin mcp language-server; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            # npm refuses to run inside the repo (devEngines wants bun), so ask from outside it
            if (cd "$RUNNER_TEMP" && npm view "$name@$version" version >/dev/null 2>&1); then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP")
            tarball=$(ls -t "$RUNNER_TEMP"/*.tgz | head -1)
            tar -xOzf "$tarball" package/package.json | node -e '
              let text = "";
              process.stdin.on("data", (d) => (text += d)).on("end", () => {
                const want = process.argv[1];
                const deps = JSON.parse(text).dependencies ?? {};
                for (const [n, v] of Object.entries(deps)) {
                  if ((n === "dialexjs" || n.startsWith("@dialexjs/")) && v !== want) {
                    console.error(`${n} is ${v} in the tarball, expected ${want}`);
                    process.exit(1);
                  }
                }
              });
            ' "$version"
            (cd "$RUNNER_TEMP" && npm publish "$tarball" --access public --provenance)
            published="$published $name@$version"
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # The tag always follows packages/core/package.json: whenever the tag or the GitHub Release
      # for that version is missing, it is created.
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub Release"
            exit 0
          fi
          # The editor extension ships as a release asset (it is not published to a marketplace).
          bun run --cwd packages/vscode build
          bun run --cwd packages/vscode package "$version" --no-update-package-json
          vsix=$(ls packages/vscode/*.vsix | head -1)
          notes=$(awk -v v="$version" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' packages/core/CHANGELOG.md)
          if [ -n "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag "$vsix"
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag "$vsix"
          fi

      # The version commit was pushed with the workflow token, which does not start the docs
      # workflow, so the changelog page would stay behind until the next docs change.
      - name: Rebuild the docs site
        if: steps.version.outputs.versioned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
