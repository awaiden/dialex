name: Release

# Every push to main either opens or updates the "Version Packages" pull request (while changesets
# are pending) or, once that PR is merged and nothing is left to version, publishes what is not on
# npm yet. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, the tag and the GitHub Release
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # With pending changesets this opens or updates the "Version Packages" PR (bumps the
      # versions, writes the changelogs, rebuilds bun.lock) and sets hasChangesets to true.
      - name: Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run ready

      # `bun pm pack` writes the versions of workspace dependencies from bun.lock, which keeps the
      # old ones after a bump. Rebuilding the lock first, and checking the tarball, is what stops
      # a package from depending on a stale release (0.2.0 did).
      - name: Publish what is not on npm yet
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          rm -f bun.lock && bun install
          published=""
          for dir in core cli mcp; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP")
            tarball=$(ls -t "$RUNNER_TEMP"/*.tgz | head -1)
            tar -xOzf "$tarball" package/package.json | node -e '
              let text = "";
              process.stdin.on("data", (d) => (text += d)).on("end", () => {
                const want = process.argv[1];
                const deps = JSON.parse(text).dependencies ?? {};
                for (const [n, v] of Object.entries(deps)) {
                  if ((n === "dialexjs" || n.startsWith("@dialexjs/")) && v !== want) {
                    console.error(`${n} is ${v} in the tarball, expected ${want}`);
                    process.exit(1);
                  }
                }
              });
            ' "$version"
            (cd "$RUNNER_TEMP" && npm publish "$tarball" --access public --provenance)
            published="$published $name@$version"
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # The tag always follows packages/core/package.json: whenever nothing is left to version and
      # the tag for that version is missing, it is created and a GitHub Release is made.
      - name: Tag and GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          # The editor extension ships as a release asset (it is not published to a marketplace).
          bun run --cwd packages/vscode build
          bun run --cwd packages/vscode package
          vsix=$(ls packages/vscode/*.vsix | head -1)
          notes=$(awk -v v="$version" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' packages/core/CHANGELOG.md)
          if [ -n "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag "$vsix"
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag "$vsix"
          fi
