name: Release

# Every push to main either opens or updates the "Version Packages" pull request (while changesets
# are pending) or, once that PR is merged and nothing is left to version, publishes what is not on
# npm yet. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, the tag and the GitHub Release
  pull-requests: write
  id-token: write # npm provenance

jobs:
  # Pending changesets mean this push only opens or updates the Version Packages PR, which
  # publishes nothing, so the binaries are built only when a publish can happen.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pending.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Look for pending changesets
        id: pending
        run: |
          count=$(ls .changeset/*.md 2>/dev/null | grep -v '/README.md$' | wc -l)
          if [ "$count" -eq 0 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

  # One native build per platform, on a runner of that platform (no cross toolchains).
  native:
    name: Native ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: win32-x64, runner: windows-latest }
          - { target: win32-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        working-directory: crates
        shell: bash
        run: cargo build --release --locked -p dialex-cli -p dialex-lsp

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            crates/target/release/dx
            crates/target/release/dx.exe
            crates/target/release/dialex-language-server
            crates/target/release/dialex-language-server.exe
          if-no-files-found: error

  release:
    name: Version PR or publish
    needs: [plan, native]
    # `native` is skipped while changesets are pending
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # With pending changesets this opens or updates the "Version Packages" PR (bumps the
      # versions, writes the changelogs, rebuilds bun.lock) and sets hasChangesets to true.
      - name: Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run ready

      # The platform packages carry the binaries; the skeletons in the repository do not.
      - name: Download the native binaries
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Assemble the native packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            dir="native-artifacts/native-$target"
            ext=""
            if [ "${target%%-*}" = "win32" ]; then ext=".exe"; fi
            node scripts/native-packages.mjs --target "$target" \
              --binary "$(find "$dir" -name "dx$ext" | head -1)" \
              --lsp-binary "$(find "$dir" -name "dialex-language-server$ext" | head -1)"
          done

      - name: Smoke test the packed packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/smoke-pack.mjs

      # `bun pm pack` writes the versions of workspace dependencies from bun.lock. The Version PR
      # rebuilds the lock (`changeset:version`), and checking each tarball is what stops a package
      # from depending on a stale release (0.2.0 did).
      - name: Publish what is not on npm yet
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published=""
          # the platform packages go first: @dialexjs/cli lists them as optional dependencies
          for dir in cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli-win32-x64 cli-win32-arm64 core cli mcp language-server; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            # npm refuses to run inside the repo (devEngines wants bun), so ask from outside it
            if (cd "$RUNNER_TEMP" && npm view "$name@$version" version >/dev/null 2>&1); then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP")
            tarball=$(ls -t "$RUNNER_TEMP"/*.tgz | head -1)
            tar -xOzf "$tarball" package/package.json | node -e '
              let text = "";
              process.stdin.on("data", (d) => (text += d)).on("end", () => {
                const want = process.argv[1];
                const deps = JSON.parse(text).dependencies ?? {};
                for (const [n, v] of Object.entries(deps)) {
                  if ((n === "dialexjs" || n.startsWith("@dialexjs/")) && v !== want) {
                    console.error(`${n} is ${v} in the tarball, expected ${want}`);
                    process.exit(1);
                  }
                }
              });
            ' "$version"
            (cd "$RUNNER_TEMP" && npm publish "$tarball" --access public --provenance)
            published="$published $name@$version"
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # The tag always follows packages/core/package.json: whenever nothing is left to version and
      # the tag or the GitHub Release for that version is missing, it is created.
      - name: Tag and GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub Release"
            exit 0
          fi
          # The editor extension ships as a release asset (it is not published to a marketplace).
          bun run --cwd packages/vscode build
          bun run --cwd packages/vscode package "$version" --no-update-package-json
          vsix=$(ls packages/vscode/*.vsix | head -1)
          notes=$(awk -v v="$version" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' packages/core/CHANGELOG.md)
          if [ -n "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag "$vsix"
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag "$vsix"
          fi
