name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Quality Verification
        run: bun run ready

      # `bun pm pack` rewrites `workspace:*` dependencies to real versions;
      # plain `npm publish` would ship them as-is and break installs.
      - name: Publish Core Package (dialexjs)
        run: |
          cd packages/core
          bun pm pack --destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/dialexjs-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI Package (@dialexjs/cli)
        run: |
          cd packages/cli
          bun pm pack --destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/dialexjs-cli-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
