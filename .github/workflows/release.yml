name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Quality Verification
        run: bun run ready

      # `bun pm pack` rewrites `workspace:*` dependencies to real versions;
      # plain `npm publish` would ship them as-is and break installs.
      # Tag, package versions and the internal dependencies that `bun pm pack` writes from
      # bun.lock must all agree, or published packages would depend on an old release.
      - name: Check release versions
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            let bad = [];
            for (const dir of ["core", "cli", "mcp"]) {
              const pkg = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8"));
              if (process.env.GITHUB_REF_TYPE === "tag" && pkg.version !== tag) bad.push(`${pkg.name} is ${pkg.version}, tag is ${tag}`);
            }
            const lock = fs.readFileSync("bun.lock", "utf8");
            for (const dir of ["core", "cli", "mcp"]) {
              const v = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8")).version;
              if (!lock.includes(`"version": "${v}"`)) bad.push(`bun.lock does not record version ${v} (${dir}); regenerate it`);
            }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '

      # A release without notes is a mistake: fail before anything is published.
      - name: Check changelog entry
        if: github.ref_type == 'tag'
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish Core Package (dialexjs)
        run: |
          cd packages/core
          bun pm pack --destination "$RUNNER_TEMP"
          # Publish from outside the repo: npm rejects the root devEngines (bun).
          cd "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/dialexjs-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI Package (@dialexjs/cli)
        run: |
          cd packages/cli
          bun pm pack --destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/dialexjs-cli-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP Package (@dialexjs/mcp)
        run: |
          cd packages/mcp
          bun pm pack --destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/dialexjs-mcp-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
